name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Tests and consistency checks
    uses: ./.github/workflows/ci.yml

  release:
    name: Build, sign, notarize and publish
    needs: checks
    runs-on: macos-26-intel
    timeout-minutes: 90
    env:
      APP_PATH: build/export/SafariKeePassXC.app
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure the tag points to a commit on main
        run: |
          git fetch --no-tags origin +main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "error: $GITHUB_REF_NAME does not point to a commit on main" >&2
            exit 1
          fi

      - name: Resolve and check the version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./scripts/check-versions.sh "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Import the signing certificates
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          printf '%s' "$CERT_P12_BASE64" | base64 -D > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$keychain"

          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          if [[ -z "$identity" ]]; then
            echo "error: no Developer ID Application identity in the imported certificate" >&2
            exit 1
          fi
          echo "DEVELOPER_ID_IDENTITY=$identity" >> "$GITHUB_ENV"

          if ! security find-identity -v -p codesigning "$keychain" | grep -q "Apple Development"; then
            echo "error: no Apple Development identity in the imported certificate (needed for the archive step)" >&2
            exit 1
          fi

      - name: Write the App Store Connect API key
        env:
          KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
        run: |
          printf '%s' "$KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project SafariKeePassXC.xcodeproj \
            -scheme SafariKeePassXC \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build/SafariKeePassXC.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Install Developer ID provisioning profiles
        env:
          PROFILE_APP_BASE64: ${{ secrets.APPLE_PROFILE_APP_BASE64 }}
          PROFILE_EXTENSION_BASE64: ${{ secrets.APPLE_PROFILE_EXTENSION_BASE64 }}
        run: |
          profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles"
          printf '%s' "$PROFILE_APP_BASE64" | base64 -D > "$profiles/SafariKeePassXC_Developer_ID.provisionprofile"
          printf '%s' "$PROFILE_EXTENSION_BASE64" | base64 -D > "$profiles/SafariKeePassXC_Extension_Developer_ID.provisionprofile"
          ls -la "$profiles"

      - name: Export and sign with Developer ID
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Developer ID Application</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>yauheni.tech.SafariKeePassXC</key>
              <string>SafariKeePassXC Developer ID</string>
              <key>yauheni.tech.SafariKeePassXC.Extension</key>
              <string>SafariKeePassXC Extension Developer ID</string>
            </dict>
          </dict>
          </plist>
          EOF
          rm -rf build/export
          xcodebuild -exportArchive \
            -archivePath build/SafariKeePassXC.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/export

      - name: Verify the app signature
        run: |
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | tee codesign.txt
          grep -q "Authority=Developer ID Application" codesign.txt
          codesign -dv --verbose=4 "$APP_PATH/Contents/PlugIns/SafariKeePassXC Extension.appex" 2>&1 | tee codesign-extension.txt
          grep -q "Authority=Developer ID Application" codesign-extension.txt

      - name: Notarize and staple the app
        env:
          KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          version="${{ steps.version.outputs.version }}"
          mkdir -p dist
          ditto -c -k --keepParent "$APP_PATH" "dist/SafariKeePassXC-$version.zip"
          xcrun notarytool submit "dist/SafariKeePassXC-$version.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$KEY_ID" \
            --issuer "$ISSUER_ID" \
            --wait
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl -a -vvv -t exec "$APP_PATH"

      - name: Build the DMG
        id: dmg
        run: |
          version="${{ steps.version.outputs.version }}"
          dmg="dist/SafariKeePassXC-$version.dmg"
          mkdir -p dist/dmg
          ditto "$APP_PATH" "dist/dmg/SafariKeePassXC.app"
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "SafariKeePassXC" \
            -srcfolder dist/dmg -ov -format UDZO "$dmg"

          codesign --force --timestamp --sign "$DEVELOPER_ID_IDENTITY" "$dmg"
          codesign --verify --strict --verbose=2 "$dmg"
          echo "path=$dmg" >> "$GITHUB_OUTPUT"

      - name: Notarize and staple the DMG
        env:
          KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          dmg="${{ steps.dmg.outputs.path }}"
          xcrun notarytool submit "$dmg" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$KEY_ID" \
            --issuer "$ISSUER_ID" \
            --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl -a -t open --context context:primary-signature -v "$dmg"

      - name: Write checksums
        run: |
          cd dist
          version="${{ steps.version.outputs.version }}"
          shasum -a 256 "SafariKeePassXC-$version.dmg" > "SafariKeePassXC-$version.dmg.sha256"
          cat "SafariKeePassXC-$version.dmg.sha256"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/SafariKeePassXC-$version.dmg" \
            "dist/SafariKeePassXC-$version.dmg.sha256" \
            --title "SafariKeePassXC $version" \
            --notes "Signed with Developer ID, notarized by Apple and stapled. Verify: \`shasum -a 256 -c SafariKeePassXC-$version.dmg.sha256\`" \
            --generate-notes

      - name: Remove the temporary keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
